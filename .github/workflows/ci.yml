name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - run: pip install -r requirements.txt

      # Tests use a temporary local database and fake providers: no secrets, no network.
      - run: python -m pytest -q

  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # expo-env.d.ts is generated by `expo start` and git-ignored. Without it TypeScript cannot
      # resolve imports such as '@/global.css'.
      - name: Generate expo-env.d.ts
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      # Typecheck before lint: `expo lint` rewrites .expo/types/router.d.ts in a form tsc rejects
      # (see README, "Route types gotcha").
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fake API settings come from jest.config.js; no secrets are needed. Fails when coverage
      # drops below the thresholds in jest.config.js.
      - name: Test with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
